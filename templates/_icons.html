{# Inline SVG icons. Usage: {{ icon('shirt', 20) }}  (names: shirt, trousers, shoes, hanger, layers, user, logout, plus, trash, eye, eye-off, grid, sparkles) #}
{% macro icon(name, size=20) -%}
<svg class="ic" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

<path d="M20.4 3.5 16 2a4 4 0 0 1-8 0L3.6 3.5a2 2 0 0 0-1.3 2.2l.6 3.5a1 1 0 0 0 1 .8H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.1a1 1 0 0 0 1-.8l.6-3.5a2 2 0 0 0-1.3-2.2z"/>

<path d="M6 3h12l1.5 18H14l-2-8.5L10 21H4.5L6 3z"/><path d="M6.2 7.5h11.6"/>

<path d="m12 2.5 9.5 5L12 12.5l-9.5-5 9.5-5z"/><path d="m2.5 12 9.5 5 9.5-5"/><path d="m2.5 16.5 9.5 5 9.5-5"/>

<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>

<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
